# Nginx vor Praxis OS — der Teil, der nicht verloren gehen darf
#
# Diese Datei ist KEINE vollstaendige Konfiguration. Sie haelt die Stellen
# fest, die von Hand auf dem Server stehen (/etc/nginx/sites-available/praxis-os)
# und die bei einer Neuinstallation sonst niemand mehr rekonstruiert. Der Rest
# — Zertifikate, Weiterleitung von 80 auf 443 — kommt von Certbot.
#
# ──────────────────────────────────────────────────────────────────────────
# DER 502, DER KEINER WAR (24.09.2026)
#
# Der Behandler kam mit dem iPhone nicht in seinen Sprechzimmer-Link: „502 Bad
# Gateway, nginx/1.24.0". Auf dem Laptop lief derselbe Link.
#
# Im Fehlerprotokoll stand die Wahrheit:
#
#     upstream sent too big header while reading response header from upstream
#
# Das ist kein Absturz. Die App hat sauber geantwortet — Nginx hat die ANTWORT
# weggeworfen, weil deren Kopfzeilen nicht in einen einzigen Puffer passten.
# Ohne `proxy_buffer_size` gilt der Standard von 4 KB, und darin muss der
# gesamte Antwortkopf Platz finden. Allein die Content-Security-Policy aus
# next.config.ts ist 1,2 KB. Erneuert Supabase die Sitzung, kommen die
# Auth-Token als mehrteiliges Set-Cookie dazu — und dann reisst es.
#
# Deshalb war es geraeteabhaengig und sprunghaft: Auf dem Laptop stand die
# Sitzung, auf dem Handy war sie abgelaufen und wurde erneuert. Wer das nicht
# weiss, sucht den Fehler in der App und findet ihn nie — dort ist keiner.
#
# Vermutlich dieselbe Ursache wie die „502 beim Kaltstart", die seit PROJ-34
# als offener Punkt gefuehrt wurde.
# ──────────────────────────────────────────────────────────────────────────

server {
    server_name wwwpraxis-os.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection close;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Siehe Kopfkommentar. Nicht entfernen, ohne die CSP zu kuerzen und die
        # Supabase-Cookies loszuwerden — beides wird nicht passieren.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Lange Antworten: TTS-Erzeugung und KI-Endpunkte.
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    client_max_body_size 10M;

    # ──────────────────────────────────────────────────────────────────────
    # DIE ANDERE RICHTUNG: ANFRAGE-Kopfzeilen (19.10.2026)
    #
    # `proxy_buffer_size` oben puffert die ANTWORT. Fuer die ANFRAGE gilt
    # `large_client_header_buffers`, Standard 8 KB — und darueber antwortet
    # Nginx mit 400, ohne die App ueberhaupt zu fragen.
    #
    # Gemessen am 19.10.2026 gegen die Live-Seite: 12 KB Cookie ergaben
    # HTTP 400. Anzeigenbesucher merken davon nichts, ihre Cookies sind
    # winzig. Es trifft ANGEMELDETE Nutzer: Supabase legt die Sitzung in
    # mehreren Cookie-Stuecken ab, und die summieren sich.
    #
    # Danach: 12 KB → 200. Die naechste Grenze ist Node selbst (16 KB,
    # Standard von `--max-http-header-size`); ab etwa 25 KB kommt 431. Das
    # liegt weit ueber realistischen Sitzungs-Cookies und bleibt deshalb,
    # wie es ist — wer es doch braucht, startet den Prozess mit
    # NODE_OPTIONS=--max-http-header-size=32768.
    # ──────────────────────────────────────────────────────────────────────
    large_client_header_buffers 4 32k;

    listen 443 ssl; # managed by Certbot
    # ssl_certificate … — von Certbot verwaltet
}

# ── Uebernehmen ───────────────────────────────────────────────────────────
#
#   nginx -t && systemctl reload nginx
#
# `reload` statt `restart`: Laufende Verbindungen werden nicht abgerissen.
# Ein Gespraech, das gerade laeuft, merkt davon nichts.
